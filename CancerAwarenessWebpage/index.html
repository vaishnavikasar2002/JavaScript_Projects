<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancer Awareness</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Cancer Awareness & Support</h1>
        <p>Awareness leads to action. Support gives strength. Together, we fight cancer</p>
    </div>

    <!-- Banner -->
    <div class="banner">
        <img src="cancer2.avif" alt="banner">
    </div>

    <!-- Motivational Quotes -->
    <section class="quotes">
        <h2>Motivational Quote</h2>
        <p id="quote">Loading...</p>
        <button id="changeBtn">Change Quote</button>
    </section>

    <!-- Contact Form -->
    <div class="contact">
        <h3>Contact Us</h3>
        <form>
            <input type="text" placeholder="Enter your name" required>
            <input type="email" placeholder="Enter your email" required>
            <textarea placeholder="Write your message" required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2025 Cancer Awareness</p>
        <p>Contact: +91 98765 43210 | info@cancerawareness.com</p>
        <p>Address: Pune, Maharashtra, India</p>
    </div>

    <!-- JS -->
    <script src="app.js"></script>
</body>
</html>
